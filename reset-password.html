<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Passwort zurücksetzen</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #050607;
      --panel: #0b0e12;
      --panel-light: #11151a;
      --border: #24282e;

      --text: #f2f2ef;
      --muted: #92979f;

      --button: #f1f0ed;
      --button-text: #0a0b0d;

      --success: #74c995;
      --error: #e57878;
    }

    body {
      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 24px;

      background:
        radial-gradient(
          circle at 75% 20%,
          #171b20 0%,
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .reset-card {
      width: 100%;
      max-width: 520px;

      padding: 48px;

      border: 1px solid var(--border);
      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          var(--panel-light),
          var(--panel)
        );

      box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.45);
    }

    .eyebrow {
      margin-bottom: 12px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 600;

      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 16px;

      font-size: 38px;
      line-height: 1.05;

      letter-spacing: -0.04em;
    }

    .description {
      margin-bottom: 32px;

      color: var(--muted);

      font-size: 15px;
      line-height: 1.7;
    }

    form {
      display: flex;
      flex-direction: column;

      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
    }

    input {
      width: 100%;
      height: 52px;

      padding: 0 15px;

      outline: none;

      border: 1px solid var(--border);
      border-radius: 9px;

      background: #090b0e;
      color: var(--text);

      font: inherit;
      font-size: 14px;

      transition:
        border-color 0.18s ease,
        background 0.18s ease;
    }

    input:hover {
      border-color: #3b4048;
    }

    input:focus {
      border-color: #646b74;
      background: #0e1115;
    }

    .submit-button {
      width: 100%;
      height: 54px;

      margin-top: 5px;

      padding: 0 20px;

      border: none;
      border-radius: 9px;

      background: var(--button);
      color: var(--button-text);

      font-size: 14px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .submit-button:hover {
      background: white;

      transform: translateY(-1px);
    }

    .message {
      min-height: 20px;

      font-size: 13px;
      line-height: 1.5;
    }

    .message.success {
      color: var(--success);
    }

    .message.error {
      color: var(--error);
    }

    .back-link {
      display: block;

      margin-top: 24px;

      color: var(--muted);

      text-align: center;
      text-decoration: none;

      font-size: 13px;
    }

    .back-link:hover {
      color: var(--text);
    }

    @media (max-width: 520px) {
      body {
        padding: 16px;
      }

      .reset-card {
        padding: 34px 24px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="reset-card">

    <p class="eyebrow">
      ACCOUNT SECURITY
    </p>

    <h1>
      Neues Passwort.
    </h1>

    <p class="description">
      Lege ein neues Passwort für deinen Account fest.
      Das Passwort muss mindestens 8 Zeichen lang sein.
    </p>


    <form id="resetForm">

      <div class="field">

        <label for="newPassword">
          Neues Passwort
        </label>

        <input
          type="password"
          id="newPassword"
          autocomplete="new-password"
          placeholder="Mindestens 8 Zeichen"
        >

      </div>


      <div class="field">

        <label for="confirmPassword">
          Passwort wiederholen
        </label>

        <input
          type="password"
          id="confirmPassword"
          autocomplete="new-password"
          placeholder="Passwort erneut eingeben"
        >

      </div>


      <button
        class="submit-button"
        type="submit"
      >
        Passwort ändern
      </button>


      <p
        id="resetMessage"
        class="message"
      ></p>

    </form>


    <a
      class="back-link"
      href="/"
    >
      Zurück zum Login
    </a>

  </main>


  <script>
    const resetForm =
      document.getElementById("resetForm");

    const resetMessage =
      document.getElementById("resetMessage");


    resetForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        resetMessage.textContent = "";
        resetMessage.className = "message";


        // Token aus der URL holen
        const params =
          new URLSearchParams(
            window.location.search
          );

        const token =
          params.get("token");


        const password =
          document
            .getElementById("newPassword")
            .value
            .trim();

        const confirmPassword =
          document
            .getElementById("confirmPassword")
            .value
            .trim();


        // Prüfen, ob beide Passwörter gleich sind
        if (password !== confirmPassword) {

          resetMessage.textContent =
            "Die Passwörter stimmen nicht überein.";

          resetMessage.classList.add(
            "error"
          );

          return;
        }


        try {

          const response =
            await fetch(
              "/reset-password",
              {

                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    token,
                    password
                  })

              }
            );


          const message =
            await response.text();


          resetMessage.textContent =
            message;


          if (response.ok) {

            resetMessage.classList.add(
              "success"
            );

            resetForm.reset();

          } else {

            resetMessage.classList.add(
              "error"
            );

          }


        } catch (error) {

          console.log(error);

          resetMessage.textContent =
            "Server nicht erreichbar.";

          resetMessage.classList.add(
            "error"
          );

        }

      }
    );
  </script>

</body>
</html>
